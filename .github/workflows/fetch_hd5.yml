name: Fetch Gewitter File and Generate Webp

on:
  workflow_dispatch:

concurrency:
  # verhindert, dass zwei Laeufe gleichzeitig dieselbe Datei generieren/hochladen
  group: fetch-gewitter
  cancel-in-progress: false

jobs:
  fetch_generate_deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10 # Sicherheitsnetz, falls die Dateien nie erscheinen

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.HG_PAT }}

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Cache Python packages
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Set RUN and DATE (rounded to 5 min, UTC)
        id: set_run_date
        run: |
          HOUR=$(date -u +%H)
          MINUTE_RAW=$(date -u +%M)
          MINUTE=$(( (10#$MINUTE_RAW / 5) * 5 ))
          TIME=$(printf "%02d%02d" "$((10#$HOUR))" "$MINUTE")
          DATE=$(date -u +%Y%m%d)

          echo "TIME=$TIME" >> "$GITHUB_ENV"
          echo "DATE=$DATE" >> "$GITHUB_ENV"
          echo "run=${DATE}_${TIME}" >> "$GITHUB_OUTPUT"

      - name: Download RV und HymecNG parallel (mit Retry)
        run: |
          MAX_ATTEMPTS=50
          SLEEP_SECONDS=5

          download_rv() {
            OUT_DIR="data/rv"
            mkdir -p "$OUT_DIR"
            TAR_NAME="composite_rv_${DATE}_${TIME}.tar"
            MEMBER="composite_rv_${DATE}_${TIME}_000-hd5"
            URL="https://opendata.dwd.de/weather/radar/composite/rv/${TAR_NAME}"
            TMP_TAR="${RUNNER_TEMP}/${TAR_NAME}"
            OUT="${OUT_DIR}/${MEMBER}"
            for i in $(seq 1 "$MAX_ATTEMPTS"); do
              HTTP_CODE=$(curl -s -o "$TMP_TAR" -w "%{http_code}" \
                --connect-timeout 10 --max-time 120 "$URL" || echo "000")
              if [ "$HTTP_CODE" = "200" ] && [ -s "$TMP_TAR" ]; then
                if tar -xf "$TMP_TAR" -C "$OUT_DIR" --wildcards "*${MEMBER}" \
                    --transform 's|.*/||' && [ -s "$OUT" ]; then
                  echo "[RV] Erfolgreich (Versuch $i/$MAX_ATTEMPTS): $OUT"
                  rm -f "$TMP_TAR"
                  return 0
                fi
                echo "[RV] Versuch $i/$MAX_ATTEMPTS: tar geladen, aber ${MEMBER} nicht extrahierbar."
              else
                echo "[RV] Versuch $i/$MAX_ATTEMPTS: tar noch nicht verfuegbar (HTTP $HTTP_CODE)."
              fi
              rm -f "$TMP_TAR" "$OUT"
              sleep "$SLEEP_SECONDS"
            done
            echo "::error::[RV] ${TAR_NAME} nach $MAX_ATTEMPTS Versuchen nicht verfuegbar - Abbruch."
            return 1
          }

          download_hymecng() {
            OUT_DIR="data/hymecng"
            mkdir -p "$OUT_DIR"
            FILE_NAME="composite_HymecNG_${DATE}_${TIME}_000-hd5"
            URL="https://opendata.dwd.de/weather/radar/composite/hymecng/${FILE_NAME}"
            OUT="${OUT_DIR}/${FILE_NAME}"
            TMP_FILE="${RUNNER_TEMP}/${FILE_NAME}"
            for i in $(seq 1 "$MAX_ATTEMPTS"); do
              HTTP_CODE=$(curl -s -o "$TMP_FILE" -w "%{http_code}" \
                --connect-timeout 10 --max-time 120 "$URL" || echo "000")
              if [ "$HTTP_CODE" = "200" ] && [ -s "$TMP_FILE" ]; then
                mv "$TMP_FILE" "$OUT"
                echo "[HymecNG] Erfolgreich (Versuch $i/$MAX_ATTEMPTS): $OUT"
                return 0
              fi
              echo "[HymecNG] Versuch $i/$MAX_ATTEMPTS: Datei noch nicht verfuegbar (HTTP $HTTP_CODE)."
              rm -f "$TMP_FILE"
              sleep "$SLEEP_SECONDS"
            done
            echo "::error::[HymecNG] ${FILE_NAME} nach $MAX_ATTEMPTS Versuchen nicht verfuegbar - Abbruch."
            return 1
          }

          download_rv &
          PID_RV=$!
          download_hymecng &
          PID_HYMECNG=$!

          STATUS=0
          wait "$PID_RV" || STATUS=1
          wait "$PID_HYMECNG" || STATUS=1

          exit $STATUS

      - name: Generate WEBP for HymecNG
        run: python scripts/generate_webp.py

      - name: Upload hg_latest.webp to R2 (mit Retry)
        run: |
          MAX_ATTEMPTS=3
          for i in $(seq 1 "$MAX_ATTEMPTS"); do
            if aws s3 cp ./output/hymecng/hg_latest.webp \
                s3://${{ secrets.R2_BUCKET }}/hymecng/hg_latest.webp \
                --endpoint-url https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com; then
              echo "Upload erfolgreich (Versuch $i/$MAX_ATTEMPTS)."
              exit 0
            fi
            echo "Upload fehlgeschlagen (Versuch $i/$MAX_ATTEMPTS), warte 10s..."
            sleep 10
          done
          echo "::error::Upload nach $MAX_ATTEMPTS Versuchen fehlgeschlagen."
          exit 1
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
